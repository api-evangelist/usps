aid: usps
name: USPS
description: The United States Postal Service (USPS) provides a modern suite of RESTful
  APIs for address validation, domestic and international pricing, shipping label
  creation and cancellation, tracking, and service standards through its developer
  portal. The APIs replace the legacy Web Tools platform and use OAuth 2.0 Client
  Credentials for authentication. The platform supports both production and TEM (Testing
  Environment for Mailers) endpoints for developing and validating shipping integrations.
type: Index
